<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persona Archive</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-star">✦</span>
        <div><b>PERSONA</b><span>ARCHIVE</span></div>
      </div>

      <label class="search">
        <span>⌕</span>
        <input id="searchInput" placeholder="Search archive..." autocomplete="off">
      </label>

      <nav class="main-nav">
        <button class="nav-item active" data-view="home">◈ <span>HOME</span></button>
        <button class="nav-item" data-view="personas">◇ <span>PERSONAS</span></button>
      </nav>

      <section class="side-section">
        <div class="side-title">WORLDS</div>
        <div id="worldList"></div>
      </section>

      <section class="side-section">
        <div class="side-title">TAGS</div>
        <div id="tagList" class="side-tags"></div>
      </section>

      <div class="sidebar-spacer"></div>
      <button class="new-entry" id="newEntryBtn">＋ NEW ENTRY</button>
      <div class="version">PERSONA ARCHIVE · v0.1</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="메뉴">☰</button>
        <div class="crumb" id="crumb">ARCHIVE / HOME</div>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" title="테마">☾</button>
        </div>
      </header>

      <div id="content"></div>
    </main>
  </div>

  <input type="file" id="importMd" accept=".md,.markdown,text/markdown" hidden>
  <script src="js/app.js"></script>
</body>
</html>
